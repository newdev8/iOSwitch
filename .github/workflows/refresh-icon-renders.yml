name: Refresh Installer icon renders

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bazel
        with:
          cache: refresh-icons
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: false
      # render_icons keeps actool's own renderings instead of the pinned ones: the IPAs freeze() pins from.
      # --config=ios27 matches the config //release:assets builds them with, so the pinned DTSDKBuild metadata
      # agrees with the real build's.
      - name: Build both Installer IPAs with live icons
        run: |
          bazel build --config=ios27 --//apps/installer:render_icons=true //apps/installer:SwitchInstaller17 //apps/installer:SwitchInstaller27
          bazel cquery --config=ios27 --output=files --//apps/installer:render_icons=true //apps/installer:SwitchInstaller17 > ipa17.txt
          bazel cquery --config=ios27 --output=files --//apps/installer:render_icons=true //apps/installer:SwitchInstaller27 > ipa27.txt
      - name: Freeze the renderings
        run: |
          python3 apps/installer/icon_renders.py \
            --icon apps/installer/AppIcon.icon \
            --out apps/installer/artwork \
            "$(cat ipa17.txt)" "$(cat ipa27.txt)"
      - name: Probe the Sileo codesign outside the sandbox
        run: |
          set +e
          bazel build //apps/sileo:Sileo
          cp -R "bazel-out/darwin_arm64-fastbuild/bin/apps/sileo/Sileo/Sileo.app" /tmp/Sileo.app
          codesign --force --sign - --timestamp=none --pagesize 4096 \
            --preserve-metadata=entitlements,flags,runtime --generate-entitlement-der \
            --identifier org.coolstar.SileoStore \
            --entitlements "bazel-out/darwin_arm64-fastbuild/bin/apps/sileo/Sileo/Sileo.entitlements" \
            /tmp/Sileo.app
          echo "probe rc=$?"
      - uses: actions/upload-artifact@v4
        with:
          name: icon-renders
          path: |
            apps/installer/artwork/icon-renders.tar.xz
            apps/installer/artwork/icon-renders.json
