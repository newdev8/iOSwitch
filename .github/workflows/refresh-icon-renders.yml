name: Refresh Installer icon renders

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bazel
        with:
          cache: refresh-icons
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: false
      # render_icons keeps actool's own renderings instead of the pinned ones: the IPAs freeze() pins from.
      - name: Build both Installer IPAs with live icons
        run: |
          bazel build --//apps/installer:render_icons=true //apps/installer:SwitchInstaller17 //apps/installer:SwitchInstaller27
          bazel cquery --output=files --//apps/installer:render_icons=true //apps/installer:SwitchInstaller17 > ipa17.txt
          bazel cquery --output=files --//apps/installer:render_icons=true //apps/installer:SwitchInstaller27 > ipa27.txt
      - name: Freeze the renderings
        run: |
          echo "ipa17=$(cat ipa17.txt) ipa27=$(cat ipa27.txt)"
          ls -la bazel-out/apps/installer/ 2>/dev/null | head
          ls -la "$(dirname "$(cat ipa17.txt)")" 2>/dev/null | tail -5
          ls -la "$(cat ipa17.txt)" "$(cat ipa27.txt)" 2>/dev/null
          bazel run //apps/installer:freeze_icons -- \
            --icon apps/installer/AppIcon.icon/icon.json \
            --out apps/installer/artwork \
            "$(cat ipa17.txt)" "$(cat ipa27.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: icon-renders
          path: |
            apps/installer/artwork/icon-renders.tar.xz
            apps/installer/artwork/icon-renders.json
