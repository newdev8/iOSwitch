name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bazel
        with:
          cache: lint
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: ${{ github.event_name == 'push' }}
      # A build evaluates a module extension only when it needs one of its repositories, so a stale lockfile entry
      # otherwise fails only the job that does (@switch_release's: the release image dry run).
      - run: bazel mod deps --lockfile_mode=error
      # The default 1 MiB cap hides a failing check's own output (bazel skips the rest); the fix needs to be readable.
      - run: bazel test --experimental_ui_max_stdouterr_bytes=16777216 //:format_test //:lint_test //:clang_tidy_test
      - run: bazel run //tools/lint:py_owners
      - if: github.event_name == 'push' && !cancelled()
        uses: ./.github/actions/bazel-save
        with:
          cache: lint
  debug:
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/bazel
        with:
          cache: debug
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
          upload: ${{ github.event_name == 'push' }}
      # The whole tree's test build outgrows what free-disk leaves beside the restored cache; the remote cache covers
      # what the disk cache held (build-ios27.yml drops it for the same reason).
      - name: Drop the restored disk cache
        run: rm -rf ~/Library/Caches/switch-ios-bazel/disk
      - run: bazel test //...
      - if: github.event_name == 'push' && !cancelled()
        uses: ./.github/actions/bazel-save
        with:
          cache: debug
  release:
    uses: ./.github/workflows/release-assets.yml
    with:
      upload: ${{ github.event_name == 'push' }}
    secrets:
      BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
